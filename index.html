<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My site</title>
<style>
  body {
    font-family: "Times New Roman", Times, serif;
  }
  .font-bar {
    text-align: center;
    margin: 1rem 0;
  }
</style>
</head>
<body>
<div class="font-bar">
  <label for="font">Font</label>
  <select id="font">
    <option value='"Times New Roman", Times, serif' selected>Times New Roman</option>
    <option value="Verdana, sans-serif">Verdana</option>
    <option value='"Courier New", Courier, monospace'>Courier New</option>
  </select>
</div>
<main id="page"></main>
<script>
var fontSelect = document.getElementById("font");
fontSelect.addEventListener("change", function () {
  document.body.style.fontFamily = fontSelect.value;
});

fetch("scriptures.txt")
  .then(function (response) {
    if (!response.ok) {
      throw new Error("missing file");
    }
    return response.text();
  })
  .then(function (text) {
    var page = document.getElementById("page");
    var blocks = text.trim().split(/\n\s*\n/);
    blocks.forEach(function (block) {
      var p = document.createElement("p");
      var lines = block.split("\n");
      lines.forEach(function (line, i) {
        if (i > 0) {
          p.appendChild(document.createElement("br"));
        }
        p.appendChild(document.createTextNode(line.trim()));
      });
      page.appendChild(p);
    });
  })
  .catch(function () {
    document.body.textContent = "Could not load scriptures.txt.";
  });
</script>
</body>
</html>
